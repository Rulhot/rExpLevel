auto-convert:
  enabled-by-default: false # включена ли автоконвертация у новых игроков
  default-mode: BOTTLE # BOTTLE: кастомные бутылочки, EXPERIENCE: обычные пузырьки
  trigger: EVENT # EVENT: после получения опыта, PERIODIC: по таймеру
  interval-seconds: 3 # для PERIODIC, 1-30

  bottle:
    keep-levels: 30 # сколько уровней оставить игроку
    bottle-levels: 15 # сколько уровней в одной бутылочке
    max-bottles-per-cycle: 64 # максимум бутылочек за одну проверку
    require-glass-bottle: true # нужна ли пустая стеклянная бутылка
    hunger-per-bottle: 0 # голод за одну бутылочку, 0 не снимать, дробь через точку или запятую

  experience:
    keep-levels: 30
    max-bottles-per-cycle: 64
    hunger-per-bottle: 0

config-version: 2 #не трогать!!!
