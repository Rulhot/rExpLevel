prefix: "<b><gradient:#b3f79c:#D6FBC9><shadow:#2D3E27:1>rExpLevel</shadow></gradient></b> <dark_gray>»</dark_gray> "

# сообщение с [actionbar] в начале показывается над хотбаром, а не в чате
command:
  no-permission: "{prefix}<white>У тебя нет прав на это."
  player-only: "{prefix}<white>Эта команда работает только у игрока."
  unknown: "{prefix}<white>Такой команды нет. Список команд: <#b3f79c>/{command} help"
  invalid-number: "{prefix}<white>Значение <#b3f79c>{value}</#b3f79c> не подходит. Введи целое положительное число."
  amount-limit: "{prefix}<white>За один раз не больше <#b3f79c>{max}</#b3f79c> бутылочек."
  levels-limit: "{prefix}<white>Уровней должно быть от <#b3f79c>1</#b3f79c> до <#b3f79c>{max}</#b3f79c>."
  player-not-found: "{prefix}<white>Игрок <#b3f79c>{player}</#b3f79c> не найден."
  not-ready: "{prefix}<white>Плагин ещё загружает данные. Подожди несколько секунд."

  pack:
    usage: "{prefix}<white>Формат команды: <#b3f79c>/{command} pack [bottle|experience] [значение] [количество]"
    not-enough: "{prefix}<white>Нужно <#b3f79c>{required}</#b3f79c> XP, у тебя <#b3f79c>{current}</#b3f79c> XP."
    not-enough-levels: "{prefix}<white>Нужно <#b3f79c>{required}</#b3f79c> ур., у тебя <#b3f79c>{current}</#b3f79c> ур."
    levels-not-allowed: "{prefix}<white>Бутылочку на <#b3f79c>{value}</#b3f79c> ур. не создать. Доступные уровни: <#b3f79c>{levels}</#b3f79c>."
    no-glass: "{prefix}<white>В инвентаре нет пустых стеклянных бутылочек."
    success: "[actionbar]<white>Создано <#b3f79c>{amount}</#b3f79c> бутылочек по <#b3f79c>{levels}</#b3f79c> ур. (<#b3f79c>{points}</#b3f79c> XP каждая)."
    experience-not-enough: "{prefix}<white>Для одной обычной бутылочки нужно хотя бы <#b3f79c>{xp} XP</#b3f79c>."
    experience-success: "[actionbar]<white>Создано <#b3f79c>{amount}</#b3f79c> обычных бутылочек, потрачено <#b3f79c>{spent}</#b3f79c> XP. Осталось <#b3f79c>{remaining}</#b3f79c> XP."

  auto:
    usage: "{prefix}<white>Формат команды: <#b3f79c>/{command} auto [on|off] [bottle|experience] [уровни]"
    enabled-bottle: "{prefix}<white>Автоконвертация в кастомные бутылочки включена. Порог: <#b3f79c>{keep}</#b3f79c> ур., фасовка по <#b3f79c>{levels}</#b3f79c> ур."
    enabled-experience: "{prefix}<white>Автоконвертация в обычные бутылочки включена. Порог: <#b3f79c>{keep}</#b3f79c> ур."
    already-enabled-bottle: "{prefix}<white>Автоконвертация в кастомные бутылочки уже включена."
    already-enabled-experience: "{prefix}<white>Автоконвертация в обычные бутылочки уже включена."
    disabled-bottle: "{prefix}<white>Автоконвертация выключена. Выбран режим кастомных бутылочек."
    disabled-experience: "{prefix}<white>Автоконвертация выключена. Выбран режим обычных бутылочек."
    already-disabled-bottle: "{prefix}<white>Автоконвертация кастомных бутылочек уже выключена."
    already-disabled-experience: "{prefix}<white>Автоконвертация обычных бутылочек уже выключена."
    disabled-no-glass: "{prefix}<white>Автоконвертация выключена: закончились пустые стеклянные бутылочки."
    no-glass: "{prefix}<white>Для автоконвертации нужна хотя бы одна пустая стеклянная бутылочка."
    mode-conflict: "{prefix}<white>Уже включён режим <#b3f79c>{mode}</#b3f79c>. Сначала выключи его: <#b3f79c>/{command} auto off {mode}"
    mode-mismatch: "{prefix}<white>Сейчас работает режим <#b3f79c>{mode}</#b3f79c>. Выключи его: <#b3f79c>/{command} auto off {mode}"
    packed-bottle: "[actionbar]<white>Лишний опыт упакован в <#b3f79c>{amount}</#b3f79c> кастомных бутылочек."
    packed-experience: "[actionbar]<white>Лишний опыт упакован в <#b3f79c>{amount}</#b3f79c> обычных бутылочек."

  give:
    usage: "{prefix}<white>Формат команды: <#b3f79c>/{command} give [игрок] [уровни] [количество]"
    sender: "{prefix}<white>Игрок <#b3f79c>{player}</#b3f79c> получил <#b3f79c>{amount}</#b3f79c> бутылочек по <#b3f79c>{levels}</#b3f79c> ур."
    target: "{prefix}<white>Ты получил <#b3f79c>{amount}</#b3f79c> бутылочек по <#b3f79c>{levels}</#b3f79c> ур."

  reload:
    usage: "{prefix}<white>Формат команды: <#b3f79c>/{command} reload"
    success: "{prefix}<white>Конфигурация перезагружена."
    failed: "{prefix}<white>Конфигурация не перезагружена. Ошибка записана в консоль."

  drink: "[actionbar]<white>Возвращено <#b3f79c>{points}</#b3f79c> XP."
  drink-full: "{prefix}<white>У тебя слишком много опыта, бутылочка не поместится."

  help:
    - "{prefix}<white>Команды:"
    - " <white>/{command} pack bottle [уровни] [количество] <dark_gray>»</dark_gray> <white>создать кастомные бутылочки"
    - " <white>/{command} pack experience [XP|all] <dark_gray>»</dark_gray> <white>создать обычные бутылочки"
    - " <white>/{command} auto [on|off] [bottle|experience] [уровни] <dark_gray>»</dark_gray> <white>автоконвертация"
    - " <white>/{command} give [игрок] [уровни] [количество] <dark_gray>»</dark_gray> <white>выдать бутылочки"
    - " <white>/{command} reload <dark_gray>»</dark_gray> <white>перезагрузить конфигурацию"

placeholder:
  auto-on: "on"
  auto-off: "off"
  mode-bottle: "bottle"
  mode-experience: "experience"

config-version: 4 #не трогать!!!
