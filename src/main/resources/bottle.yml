bottle-create: false # true: любой уровень до max-levels, false: только уровни из bottles

# общий вид бутылочки для уровней, которых нет в bottles
bottle:
  material: EXPERIENCE_BOTTLE
  name: "<gray>[<#b3f79c>🧪</#b3f79c>] <white>Пузырек с опытом</white> <gray>({points} xp)</gray>"
  lore:
    - ''
    - " <white>Содержит в себе: <#99ff66>{levels} LVL</white>"
    - " <gray>Нажми ПКМ, чтобы забрать опыт</gray>"
    - ''
  glint: true
  custom-model-data: 0 # 0 выключено
  max-levels: 500 # предел уровней в одной бутылке для pack и give
  require-glass-bottle: true # нужна ли пустая стеклянная бутылка для pack
  return-glass-bottle: false # работает, только если require-glass-bottle: true здесь и в auto.yml
  redeem: DRINK # DRINK: выпить по ПКМ, THROW: бросить как обычный пузырёк
  exp-give: FOLD # ADD: уровни плюсуются к текущим, FOLD: опыт считается в XP, как в ванилле

# свой вид по уровню, ключ это уровень. Пропущенные поля берутся из bottle, в name и lore работают {levels} и {points}
bottles:
  15:
    material: EXPERIENCE_BOTTLE
    name: "<gray>[<#b3f79c>🧪</#b3f79c>] <white>Пузырек с 15 уровнем</white>"
    lore:
      - ''
      - " <white>Содержит в себе: <#99ff66>15</#99ff66> уровней опыта"
      - " <gray>Нажми ПКМ, чтобы забрать опыт</gray>"
      - ''
  30:
    material: EXPERIENCE_BOTTLE
    name: "<gray>[<#b3f79c>🧪</#b3f79c>] <white>Пузырек с 30 уровнем</white>"
    lore:
      - ''
      - " <white>Содержит в себе: <#99ff66>30</#99ff66> уровней опыта"
      - " <gray>Нажми ПКМ, чтобы забрать опыт</gray>"
      - ''

experience:
  xp-per-bottle: 7 # XP в одном обычном пузырьке

config-version: 5 #не трогать!!!
